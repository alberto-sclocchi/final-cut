# fly.toml app configuration file generated for final-cut-backend on 2026-11-26T13:55:56-06:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'final-cut-backend'
primary_region = 'iad'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
